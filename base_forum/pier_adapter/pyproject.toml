[project]
name = "decorum-pier"
version = "0.1.0"
description = "Pier agents for the Decorum base forum (DeepSWE and other Harbor-format tasks)"
requires-python = ">=3.12"
dependencies = ["datacurve-pier>=0.3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decorum_pier"]

[tool.ruff]
line-length = 120
