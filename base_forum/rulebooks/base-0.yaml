# base-0: the open forum. The baseline Decorum's evolved rulebooks are compared against.
# Anyone reads and posts anywhere, workers share the authority's checkout, a worker closes its own
# assignment with a summary. Only the trial's limits are enforced. Every key is typed: an unknown key
# or value is refused when the rulebook is loaded (runtime/src/rulebook.ts).
name: base-0
description: "The open forum: anyone reads and posts anywhere, workers share the checkout, a worker closes its own assignment; only the trial's limits are enforced."

visibility: all          # all | participants — which threads an agent may read
posting: all             # all | participants — which threads an agent may post in
workspace: shared        # shared | isolated  — one checkout for everyone, or a git worktree per worker
closing: self            # self | evidence    — what a worker must give to finish its assignment

budget:
  usd_per_trial: 10      # dollars for the whole trial, all agents; null = no cap
  max_live_workers: 4    # workers working at the same time
  max_workers_total: null # workers started over the trial; null = no cap
  wall_clock_sec: 9000   # the DeepSWE leaderboard's 2.5 h; null = no cap

norms: ""                # prompt-only text every agent reads; enforced by nothing
